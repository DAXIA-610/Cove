name: squash

# 把仓库里那三个补丁脚本的成果并成真源码，然后连自己一起删掉。
# 只跑一次。跑完之后：仓库里只剩真源码，谁都不用手动跑脚本了。

on:
  push:
    paths:
      - ".github/workflows/squash.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 依次跑那三发补丁
        run: |
          python3 --version
          python3 patch_20261002.py
          python3 patch_20261002c.py
          python3 patch_20261002d.py
          wc -l hub.py index.html llm.py rooms.py websearch.py

      - name: 语法检查（过不了就不提交）
        run: python3 -m py_compile hub.py llm.py rooms.py websearch.py

      - name: 收拾干净
        run: |
          rm -f *.bak
          rm -f patch_20261002.py patch_20261002c.py patch_20261002d.py
          rm -rf __pycache__ .github
          ls -l

      - name: 提交
        run: |
          git config user.name "cove"
          git config user.email "cove@localhost"
          git add -A
          git commit -m "并成真源码：以后只 pull，谁都不用手动跑脚本了"
          git push
