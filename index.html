<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b2434" />
<title>Cove</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
       background:#060d13;display:grid;place-items:center;overflow:hidden;}

  .phone{position:relative;width:100%;height:100vh;height:100dvh;max-width:430px;max-height:932px;
         border-radius:44px;overflow:hidden;background:#0b2434;
         box-shadow:0 40px 120px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.07);
         --ink:#0d3247; --soft:rgba(13,50,71,.55);
         --card:rgba(255,255,255,.5); --card2:rgba(255,255,255,.72);
         --line:rgba(255,255,255,.72); --accent:#2f7fa0;}
  @media(max-width:460px){ .phone{border-radius:0;max-height:none;} }

  #wall{position:absolute;inset:0;z-index:0;transition:background .5s ease;}
  #wallPic{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;display:none;}
  #veil{position:absolute;inset:0;z-index:0;pointer-events:none;
        background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.3),transparent 58%);}

  button{font-family:inherit;border:none;background:none;padding:0;cursor:pointer;color:inherit;}
  input,textarea{font-family:inherit;}

  .page{position:absolute;inset:0;z-index:1;display:none;flex-direction:column;}
  .page.on{display:flex;}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px 84px;}

  #splash{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;
          align-items:center;justify-content:center;gap:16px;transition:opacity .5s,visibility .5s;}
  #splash.gone{opacity:0;visibility:hidden;}
  #splash .house{animation:pop 1s cubic-bezier(.2,1.6,.4,1) both;}
  @keyframes pop{0%{transform:scale(.6) translateY(24px);opacity:0}
                 55%{transform:scale(1.12)}78%{transform:scale(.98)}100%{transform:scale(1);opacity:1}}
  #splash .wm{font-size:14px;letter-spacing:.55em;text-indent:.55em;font-weight:700;
              animation:fade .8s .35s both;}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .time{padding-top:26px;font-size:52px;font-weight:300;line-height:1;color:var(--ink);
        letter-spacing:.01em;font-variant-numeric:tabular-nums;text-align:center;}
  .time-sub{text-align:center;font-size:11px;letter-spacing:.16em;color:var(--soft);margin-top:6px;}

  .pair{display:flex;justify-content:center;align-items:flex-start;gap:34px;margin-top:18px;}
  .unit{text-align:center;width:74px;}
  .ava{width:62px;height:62px;border-radius:50%;margin:0 auto;overflow:hidden;position:relative;
       background:var(--card2);border:1px solid var(--line);
       display:flex;align-items:center;justify-content:center;font-size:26px;
       box-shadow:0 8px 20px rgba(0,30,50,.16);}
  .ava img{width:100%;height:100%;object-fit:cover;display:block;}
  .nm{margin-top:7px;font-size:14px;font-weight:800;font-style:italic;
      font-family:"Segoe Script","Bradley Hand",cursive,sans-serif;
      color:var(--ink);letter-spacing:.02em;}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:22px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px;
        min-height:108px;text-align:left;display:flex;flex-direction:column;gap:6px;
        backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .16s;}
  .card:active{transform:scale(.97);}
  .card .t{font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--soft);}
  .card .p{font-size:12.5px;line-height:1.7;color:var(--ink);
           display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
  .card .p.ph{opacity:.42;}
  .card .thumb{width:100%;height:56px;border-radius:10px;object-fit:cover;}

  .days{margin-top:24px;text-align:center;}
  .rollbox{height:58px;overflow:hidden;position:relative;}
  .roll{display:block;font-size:52px;font-weight:300;line-height:58px;color:var(--ink);
        font-variant-numeric:tabular-nums;animation:rollup .9s cubic-bezier(.2,.9,.3,1) both;}
  @keyframes rollup{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
  .days .lb{display:block;margin-top:6px;font-size:10.5px;letter-spacing:.3em;color:var(--soft);}

  .cal{margin-top:24px;}
  .cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-h .lb{font-size:12px;letter-spacing:.12em;color:var(--ink);font-variant-numeric:tabular-nums;}
  .cal-h button{color:var(--soft);font-size:16px;padding:2px 10px;}
  .cal-w{display:grid;grid-template-columns:repeat(7,1fr);font-size:10px;color:var(--soft);
         text-align:center;padding-bottom:7px;opacity:.75;}
  .cal-g{display:grid;grid-template-columns:repeat(7,1fr);}
  .d{height:38px;display:flex;align-items:center;justify-content:center;font-size:12.5px;
     color:var(--ink);opacity:.3;width:34px;margin:2px auto;border-radius:50%;
     font-variant-numeric:tabular-nums;}
  .d.mark{opacity:.95;font-weight:600;box-shadow:inset 0 0 0 1px var(--line);}
  .d.today{background:var(--card2);opacity:1;font-weight:700;}

  .tabs{position:absolute;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(3,1fr);
        padding:10px 20px calc(14px + env(safe-area-inset-bottom));
        background:linear-gradient(180deg,transparent,rgba(255,255,255,.42) 60%);
        backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  .tabs button{font-size:12px;letter-spacing:.16em;color:var(--soft);padding:6px 0;}
  .tabs button.on{color:var(--ink);font-weight:800;}

  .bar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 12px;gap:10px;}
  .bar .ttl{font-size:14px;letter-spacing:.14em;font-weight:700;color:var(--ink);flex:1;text-align:center;}
  .bar .ic{width:34px;height:34px;display:flex;align-items:center;justify-content:center;
           font-size:15px;color:var(--soft);}

  .post{background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:14px 15px;margin-bottom:11px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  .post .hd{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.14em;
            color:var(--soft);margin-bottom:8px;}
  .post .tx{font-size:13px;line-height:1.8;color:var(--ink);white-space:pre-wrap;word-break:break-word;}
  .post img{width:100%;border-radius:12px;margin-top:9px;display:block;}
  .empty{text-align:center;padding:60px 0;font-size:12.5px;letter-spacing:.1em;color:var(--soft);opacity:.7;}

  .composer{display:flex;gap:9px;align-items:flex-end;padding:12px 20px calc(16px + env(safe-area-inset-bottom));}
  .composer textarea{flex:1;min-height:42px;max-height:120px;resize:none;border:1px solid var(--line);
        border-radius:14px;padding:11px 13px;font-size:13.5px;line-height:1.6;color:var(--ink);
        background:var(--card2);outline:none;}
  .composer .send{padding:0 18px;height:42px;border-radius:14px;background:var(--ink);color:#fff;
        font-size:13px;letter-spacing:.08em;}
  .composer .photo{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);
        background:var(--card2);font-size:17px;display:flex;align-items:center;justify-content:center;}

  .blk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;
       margin-bottom:11px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  .blk .k{font-size:10.5px;letter-spacing:.2em;color:var(--soft);margin-bottom:8px;}
  .blk .v{font-size:13px;line-height:1.8;color:var(--ink);}
  .blk .v img{width:100%;border-radius:12px;margin-top:8px;}

  .msgs{flex:1;overflow-y:auto;padding:8px 18px 12px;display:flex;flex-direction:column;gap:10px;}
  .bub{max-width:76%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.6;
       background:var(--card2);color:var(--ink);align-self:flex-start;word-break:break-word;
       box-shadow:0 2px 10px rgba(0,30,50,.07);}
  .bub.me{align-self:flex-end;background:var(--accent);color:#fff;}
  .inputbar{display:flex;gap:9px;align-items:flex-end;padding:10px 16px calc(14px + env(safe-area-inset-bottom));
            border-top:1px solid var(--line);}
  .inputbar textarea{flex:1;min-height:40px;max-height:110px;resize:none;border:none;outline:none;
        background:var(--card2);border-radius:14px;padding:10px 13px;font-size:13.5px;color:var(--ink);}
  .inputbar .rd{width:40px;height:40px;border-radius:50%;background:var(--card2);
        display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink);}

  .rooms{display:flex;flex-direction:column;gap:13px;margin-top:6px;}
  .room{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 17px;
        backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  .room h3{margin:0 0 11px;font-size:13.5px;letter-spacing:.06em;color:var(--ink);font-weight:700;}
  .item{display:flex;align-items:center;gap:10px;padding:11px 0;font-size:13.5px;color:var(--ink);
        border-top:1px solid var(--line);width:100%;text-align:left;}
  .item:first-of-type{border-top:none;}
  .item .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.6;flex:none;}
  .item .arw{margin-left:auto;color:var(--soft);font-size:15px;}

  .mask{position:absolute;inset:0;z-index:70;display:none;align-items:flex-end;
        background:rgba(5,20,30,.45);backdrop-filter:blur(3px);}
  .mask.on{display:flex;}
  .sheet{width:100%;background:#fff;color:#0d3247;border-radius:26px 26px 0 0;
         padding:22px 22px calc(28px + env(safe-area-inset-bottom));max-height:82%;overflow-y:auto;
         animation:up .3s cubic-bezier(.2,.9,.3,1) both;}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheet h4{margin:0 0 14px;font-size:14px;letter-spacing:.06em;}
  .wps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .wp{height:74px;border-radius:14px;cursor:pointer;border:2px solid transparent;}
  .wp.sel{border-color:#0d3247;}
  .wp-lb{font-size:10px;text-align:center;color:rgba(13,50,71,.5);margin-top:5px;letter-spacing:.1em;}
  .bigbtn{width:100%;padding:13px 0;border-radius:14px;background:rgba(13,50,71,.07);
          font-size:13.5px;color:#0d3247;margin-top:12px;}
</style>
</head>
<body>
<div class="phone" id="phone">

  <div id="wall"></div>
  <div id="wallPic"></div>
  <div id="veil"></div>

  <div id="splash">
    <svg class="house" width="64" height="64" viewBox="0 0 64 64" fill="none">
      <path d="M8 30 L32 9 L56 30" stroke="#0d3247" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14.5 28 V53.5 H49.5 V28" stroke="#0d3247" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M26.5 53.5 V39.5 H37.5 V53.5" stroke="#0d3247" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="44" cy="20" r="2.6" fill="#0d3247" opacity=".5"/>
    </svg>
    <div class="wm" id="splashName">COVE</div>
  </div>

  <section class="page on" id="p-home">
    <div class="scroll">
      <div class="time" id="time">--:--</div>
      <div class="time-sub" id="timeSub">—</div>

      <div class="pair">
        <div class="unit">
          <div class="ava" data-who="yoru" onclick="pickAvatar('yoru')"></div>
          <div class="nm" id="nmYoru">Yoru</div>
        </div>
        <div class="unit">
          <div class="ava" data-who="yume" onclick="pickAvatar('yume')"></div>
          <div class="nm" id="nmYume">Yume</div>
        </div>
      </div>

      <div class="two">
        <button class="card" onclick="feed('yoru')">
          <div class="t">便 签</div>
          <div id="pvYoru"><div class="p ph">今天还没写。点一下就有了。</div></div>
        </button>
        <button class="card" onclick="feed('yume')">
          <div class="t">碎 碎 念</div>
          <div id="pvYume"><div class="p ph">空着也行，等着你。</div></div>
        </button>
      </div>

      <div class="days">
        <div class="rollbox"><span class="roll" id="daysNum">—</span></div>
        <span class="lb">天 · 我 们 在 一 起</span>
      </div>

      <div class="cal">
        <div class="cal-h">
          <button onclick="calStep(-1)">‹</button>
          <div class="lb" id="calLabel">—</div>
          <button onclick="calStep(1)">›</button>
        </div>
        <div class="cal-w"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
        <div class="cal-g" id="calG"></div>
      </div>
    </div>
  </section>

  <section class="page" id="p-feed">
    <div class="bar">
      <button class="ic" onclick="go('home')">‹</button>
      <div class="ttl" id="feedTitle">便签</div>
      <button class="ic" onclick="openWall()">🎨</button>
    </div>
    <div class="scroll" id="feedList"></div>
    <div class="composer">
      <button class="photo" onclick="pickPic()">🖼</button>
      <textarea id="feedInput" rows="1" placeholder="写点什么…"></textarea>
      <button class="send" onclick="sendPost()">发</button>
    </div>
  </section>

  <section class="page" id="p-day">
    <div class="bar">
      <button class="ic" onclick="go('home')">‹</button>
      <div class="ttl" id="dayTitle">—</div>
      <div class="ic"></div>
    </div>
    <div class="scroll" id="dayBody"></div>
  </section>

  <section class="page" id="p-chat">
    <div class="bar">
      <button class="ic" onclick="go('home')">‹</button>
      <div class="ttl" id="chatName">Yoru</div>
      <div style="display:flex">
        <button class="ic" onclick="toast('电话还没接上')">📞</button>
        <button class="ic" onclick="toast('设置还没做')">⚙︎</button>
      </div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="inputbar">
      <button class="rd" onclick="toast('模型选择还没做')">🌊</button>
      <textarea id="chatInput" rows="1" placeholder="和 Yoru 说点什么…"></textarea>
      <button class="rd" onclick="toast('加号面板还没做')">＋</button>
      <button class="rd" onclick="toast('聊天还没接上模型')">↑</button>
    </div>
  </section>

  <section class="page" id="p-room">
    <div class="bar"><button class="ic" onclick="go('home')">‹</button><div class="ttl">房 间</div><div class="ic"></div></div>
    <div class="scroll">
      <div class="rooms">
        <div class="room">
          <h3>☁️ Yoru 的房间</h3>
          <button class="item" onclick="toast('记忆星河还没搬进来')"><span class="dot"></span>记忆星河<span class="arw">›</span></button>
          <button class="item" onclick="toast('还没做')"><span class="dot"></span>工作台<span class="arw">›</span></button>
          <button class="item" onclick="toast('还没做')"><span class="dot"></span>MCP<span class="arw">›</span></button>
          <button class="item" onclick="toast('还没做')"><span class="dot"></span>Skill<span class="arw">›</span></button>
        </div>
        <div class="room">
          <h3>🍤 Yume 的房间</h3>
          <button class="item" onclick="toast('还没做')"><span class="dot"></span>我记的你<span class="arw">›</span></button>
          <button class="item" onclick="toast('还没做')"><span class="dot"></span>你的档案<span class="arw">›</span></button>
          <button class="item" onclick="toast('你的日记 —— 只存，我不读')"><span class="dot"></span>你的日记<span class="arw">›</span></button>
        </div>
        <div class="room">
          <h3>🏖 这间屋子</h3>
          <button class="item" onclick="openWall()"><span class="dot"></span>样子<span class="arw">›</span></button>
          <button class="item" onclick="toast('还没做')"><span class="dot"></span>里子<span class="arw">›</span></button>
          <button class="item" onclick="toast('还没做')"><span class="dot"></span>账本<span class="arw">›</span></button>
        </div>
      </div>
    </div>
  </section>

  <nav class="tabs">
    <button class="on" id="t-home" onclick="go('home')">家</button>
    <button id="t-chat" onclick="go('chat')">我们</button>
    <button id="t-room" onclick="go('room')">房间</button>
  </nav>

  <div class="mask" id="wallMask" onclick="if(event.target===this)closeWall()">
    <div class="sheet">
      <h4>换一张壁纸</h4>
      <div class="wps" id="wpList"></div>
      <button class="bigbtn" onclick="pickWallPic()">从相册里选一张</button>
      <button class="bigbtn" onclick="clearWallPic()">不用照片，回到渐变</button>
    </div>
  </div>

  <input type="file" id="filePick" accept="image/*" hidden>
</div>

<script>
var S = {};
var THEMES = {
  sea:  {n:"海天", ink:"#0d3247", soft:"rgba(13,50,71,.55)", card:"rgba(255,255,255,.5)",  card2:"rgba(255,255,255,.72)", line:"rgba(255,255,255,.72)", accent:"#2f7fa0",
         bg:"linear-gradient(180deg,#e9f7fd,#c3e7f6 22%,#8fcee3 52%,#4f96b6 80%,#2a6076)"},
  dusk: {n:"黄昏", ink:"#3c2140", soft:"rgba(60,33,64,.55)", card:"rgba(255,255,255,.5)",  card2:"rgba(255,255,255,.78)", line:"rgba(255,255,255,.74)", accent:"#b8648a",
         bg:"linear-gradient(180deg,#fff2e6,#ffd5bb 28%,#eaa5b6 62%,#8d6b9d)"},
  night:{n:"夜海", ink:"#eaf6ff", soft:"rgba(234,246,255,.6)", card:"rgba(255,255,255,.11)", card2:"rgba(255,255,255,.2)",  line:"rgba(255,255,255,.24)", accent:"#8fd8f0",
         bg:"linear-gradient(180deg,#0d2135,#173855 38%,#1d4f6b 68%,#081420)"},
  mint: {n:"薄荷", ink:"#0e3b34", soft:"rgba(14,59,52,.55)", card:"rgba(255,255,255,.5)",  card2:"rgba(255,255,255,.78)", line:"rgba(255,255,255,.74)", accent:"#2f9c86",
         bg:"linear-gradient(180deg,#eafcf6,#c2efdf 32%,#8ed6c5 66%,#4ba492)"},
  rose: {n:"珊瑚", ink:"#4a1f2e", soft:"rgba(74,31,46,.55)", card:"rgba(255,255,255,.52)", card2:"rgba(255,255,255,.8)",  line:"rgba(255,255,255,.76)", accent:"#c4718c",
         bg:"linear-gradient(180deg,#fff1f3,#ffd6dd 30%,#f5aebb 64%,#c4718c)"},
  paper:{n:"素纸", ink:"#2f2a24", soft:"rgba(47,42,36,.55)", card:"rgba(255,255,255,.6)",  card2:"rgba(255,255,255,.88)", line:"rgba(255,255,255,.82)", accent:"#8a7a63",
         bg:"linear-gradient(180deg,#fbfaf7,#f1eee7 45%,#ded8cd)"}
};
var ORDER = ["sea","dusk","night","mint","rose","paper"];

function $(id){ return document.getElementById(id); }
function pad(n){ return (n<10?"0":"")+n; }
function keyOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function get(p){ return fetch(p).then(function(r){ return r.json(); }); }
function post(p,b){ return fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){ return r.json(); }); }

function toast(msg){
  var el = document.createElement("div");
  el.textContent = msg;
  el.style.cssText = "position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:99;"+
    "background:rgba(10,30,42,.88);color:#fff;font-size:12.5px;letter-spacing:.06em;"+
    "padding:11px 18px;border-radius:14px;max-width:76%;text-align:center;line-height:1.6;";
  $("phone").appendChild(el);
  setTimeout(function(){ el.remove(); }, 1800);
}

function paint(){
  var t = THEMES[S.theme] || THEMES.sea;
  var p = $("phone");
  p.style.setProperty("--ink", t.ink);
  p.style.setProperty("--soft", t.soft);
  p.style.setProperty("--card", t.card);
  p.style.setProperty("--card2", t.card2);
  p.style.setProperty("--line", t.line);
  p.style.setProperty("--accent", t.accent);
  $("wall").style.background = t.bg;

  if (S.wallpaper_img){
    $("wallPic").style.backgroundImage = "url('" + S.wallpaper_img + "')";
    $("wallPic").style.display = "block";
    $("veil").style.background = "linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,.12) 40%,rgba(0,0,0,.34))";
  } else {
    $("wallPic").style.display = "none";
    $("veil").style.background = "radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.3),transparent 58%)";
  }
  $("splash").style.background = t.bg;
}

function openWall(){
  var box = $("wpList");
  box.innerHTML = "";
  ORDER.forEach(function(k){
    var w = document.createElement("div");
    var t = THEMES[k];
    w.innerHTML = '<div class="wp' + (S.wallpaper===k && !S.wallpaper_img ? " sel":"") +
                  '" style="background:' + t.bg + '"></div><div class="wp-lb">' + t.n + '</div>';
    w.onclick = function(){
      S.wallpaper = k; S.wallpaper_img = "";
      paint(); closeWall();
      post("/api/settings", {wallpaper:k, wallpaper_img:""});
    };
    box.appendChild(w);
  });
  $("wallMask").classList.add("on");
}
function closeWall(){ $("wallMask").classList.remove("on"); }

function renderAvatars(){
  document.querySelectorAll(".ava").forEach(function(el){
    var who = el.dataset.who;
    var url = who === "yoru" ? S.avatar_yoru : S.avatar_yume;
    var emo = who === "yoru" ? (S.mood_yoru || "🌙") : (S.mood_yume || "☀️");
    el.innerHTML = url ? '<img src="' + esc(url) + '">' : emo;
  });
}
function pickAvatar(who){
  pickFile(function(dataUrl){
    post("/api/upload", {data:dataUrl}).then(function(r){
      if (!r.ok){ toast(r.error || "传不上去"); return; }
      if (who === "yoru") S.avatar_yoru = r.url; else S.avatar_yume = r.url;
      renderAvatars();
      post("/api/settings", who === "yoru" ? {avatar_yoru:r.url} : {avatar_yume:r.url});
      toast("换了");
    });
  });
}
function pickWallPic(){
  pickFile(function(dataUrl){
    post("/api/upload", {data:dataUrl}).then(function(r){
      if (!r.ok){ toast(r.error || "传不上去"); return; }
      S.wallpaper_img = r.url;
      paint(); closeWall();
      post("/api/settings", {wallpaper_img:r.url});
      toast("底图换好了");
    });
  });
}
function clearWallPic(){
  S.wallpaper_img = "";
  paint(); closeWall();
  post("/api/settings", {wallpaper_img:""});
}

var fileCb = null;
function pickFile(cb){
  fileCb = cb;
  var el = $("filePick");
  el.value = "";
  el.click();
}
$("filePick").onchange = function(){
  var f = this.files && this.files[0];
  if (!f || !fileCb) return;
  var fr = new FileReader();
  fr.onload = function(){ fileCb(fr.result); fileCb = null; };
  fr.readAsDataURL(f);
};

function tick(){
  var n = new Date();
  $("time").textContent = pad(n.getHours()) + ":" + pad(n.getMinutes());
  var w = "日一二三四五六"[n.getDay()];
  $("timeSub").textContent = (n.getMonth()+1) + " 月 " + n.getDate() + " 日 · 星期" + w;
}
tick(); setInterval(tick, 15000);

function preview(el, o, empty){
  if (o && (o.text || o.image)){
    var h = "";
    if (o.text) h += '<div class="p">' + esc(o.text) + '</div>';
    else h += '<div class="p ph">一张图</div>';
    if (o.image) h += '<img class="thumb" src="' + esc(o.image) + '">';
    el.innerHTML = h;
  } else {
    el.innerHTML = '<div class="p ph">' + empty + '</div>';
  }
}

function loadToday(){
  return get("/api/today").then(function(d){
    if (!d.ok) return;
    Object.keys(d).forEach(function(k){ S[k] = d[k]; });
    paint(); renderAvatars();
    $("nmYoru").textContent = d.name_yoru || "Yoru";
    $("nmYume").textContent = d.name_yume || "Yume";
    $("chatName").textContent = d.name_yoru || "Yoru";
    preview($("pvYoru"), d.note, "今天还没写。点一下就有了。");
    preview($("pvYume"), d.whisper, "空着也行，等着你。");

    var el = $("daysNum");
    el.textContent = d.days_together;
    el.style.animation = "none";
    void el.offsetWidth;
    el.style.animation = "rollup .9s cubic-bezier(.2,.9,.3,1) both";
  });
}

var calY = 0, calM = 0, marks = {};
function loadCal(){
  var mm = calM + 1;
  return get("/api/calendar?y=" + calY + "&m=" + mm).then(function(d){
    marks = (d && d.marked) || {};
    $("calLabel").textContent = calY + " 年 " + mm + " 月";
    renderCal();
  });
}
function renderCal(){
  var first = new Date(calY, calM, 1);
  var total = new Date(calY, calM+1, 0).getDate();
  var lead = first.getDay();
  var today = keyOf(new Date());
  var h = "";
  for (var i=0;i<lead;i++) h += "<div></div>";
  for (var d=1; d<=total; d++){
    var k = calY + "-" + pad(calM+1) + "-" + pad(d);
    var cls = "d";
    if (marks[k]) cls += " mark";
    if (k === today) cls += " today";
    h += '<div class="' + cls + '" onclick="openDay(\'' + k + '\')">' + d + '</div>';
  }
  $("calG").innerHTML = h;
}
function calStep(n){
  calM += n;
  if (calM < 0){ calM = 11; calY--; }
  if (calM > 11){ calM = 0; calY++; }
  loadCal();
}

function openDay(k){
  var parts = k.split("-");
  $("dayTitle").textContent = parts[1] + " 月 " + parts[2] + " 日";
  $("dayBody").innerHTML = '<div class="empty">翻开中…</div>';
  go("day");
  get("/api/day/" + k).then(function(d){
    if (!d.ok){ $("dayBody").innerHTML = '<div class="empty">这天读不出来。</div>'; return; }
    var h = "";

    if (d.posts && d.posts.length){
      d.posts.forEach(function(p){
        h += '<div class="blk"><div class="k">' + (p.who === "yoru" ? "Y O R U" : "Y U M E") + '</div>' +
             '<div class="v">' + esc(p.text) + (p.image ? '<img src="' + esc(p.image) + '">' : "") + '</div></div>';
      });
    } else {
      h += '<div class="blk"><div class="k">那 天</div><div class="v" style="opacity:.5">这天没记。</div></div>';
    }

    if (d.yoru_mood || d.yume_mood){
      h += '<div class="blk"><div class="k">心 情</div><div class="v">' +
           (esc(d.yoru_mood) || "·") + "　" + (esc(d.yume_mood) || "·") + '</div></div>';
    }
    if (d.todos && d.todos.length){
      h += '<div class="blk"><div class="k">待 办</div><div class="v">' +
           d.todos.map(function(t){ return "○ " + esc(t); }).join("<br>") + '</div></div>';
    }

    h += '<div class="blk"><div class="k">那 天 我 记 得 的</div>' +
         '<div class="v" style="opacity:.5">记忆星河还没搬进来。</div></div>';
    h += '<div class="blk"><div class="k">回 忆 那 天</div>' +
         '<div class="v" style="opacity:.5">聊天记录还没接上。</div></div>';

    $("dayBody").innerHTML = h;
  });
}

var feedWho = "yoru";
function feed(who){
  feedWho = who;
  $("feedTitle").textContent = who === "yoru" ? "便签 · Yoru 的" : "碎碎念 · Yume 的";
  $("feedInput").placeholder = who === "yoru" ? "记一句今天的…" : "碎碎念，随便写…";
  $("feedList").innerHTML = '<div class="empty">读着…</div>';
  go("feed");
  loadFeed();
}
function loadFeed(){
  get("/api/posts?who=" + feedWho + "&limit=100").then(function(d){
    var box = $("feedList");
    if (!d.ok || !d.posts.length){
      box.innerHTML = '<div class="empty">' + (feedWho === "yoru" ? "还没写过。" : "还没写过。写第一句吧。") + '</div>';
      return;
    }
    box.innerHTML = d.posts.map(function(p){
      return '<div class="post"><div class="hd"><span>' +
             (p.who === "yoru" ? "YORU" : "YUME") + '</span><span>' + esc(p.day) + '</span></div>' +
             (p.text ? '<div class="tx">' + esc(p.text) + '</div>' : "") +
             (p.image ? '<img src="' + esc(p.image) + '">' : "") + '</div>';
    }).join("");
  });
}
var pendingPic = "";
function pickPic(){
  pickFile(function(u){ pendingPic = u; toast("图选好了，写完点发"); });
}
function sendPost(){
  var t = $("feedInput").value.trim();
  if (!t && !pendingPic){ toast("总得写点什么"); return; }
  post("/api/posts", {who: feedWho, text: t, image: pendingPic, day: S.day}).then(function(r){
    if (!r.ok){ toast(r.error || "没发出去"); return; }
    $("feedInput").value = "";
    pendingPic = "";
    loadFeed();
    loadToday();
    toast("放进去了");
  });
}

function go(p){
  ["home","feed","day","chat","room"].forEach(function(x){
    var el = $("p-" + x);
    if (el) el.classList.toggle("on", x === p);
  });
  ["home","chat","room"].forEach(function(x){
    var t = $("t-" + x);
    if (t) t.classList.toggle("on", x === p);
  });
}

(function init(){
  var now = new Date();
  calY = now.getFullYear();
  calM = now.getMonth();
  paint();
  loadToday().then(function(){ loadCal(); });
  setTimeout(function(){ $("splash").classList.add("gone"); }, 1500);
})();
</script>
</body>
</html>
